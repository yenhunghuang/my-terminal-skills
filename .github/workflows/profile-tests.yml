name: Portable profile tests
on:
  push:
    paths: ['agent-profile/**', 'scripts/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/profile-tests.yml']
  pull_request:
    paths: ['agent-profile/**', 'scripts/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/profile-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv run --locked python -m unittest discover -s tests -v
